{% if page.has_other_pages %}<nav class="pagination" aria-label="分页">{% if page.has_previous %}<a href="?start={{ request.GET.start|urlencode }}&end={{ request.GET.end|urlencode }}&q={{ request.GET.q|urlencode }}&has_evidence={{ request.GET.has_evidence|urlencode }}&verified={{ request.GET.verified|urlencode }}&page={{ page.previous_page_number }}">上一页</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?start={{ request.GET.start|urlencode }}&end={{ request.GET.end|urlencode }}&q={{ request.GET.q|urlencode }}&has_evidence={{ request.GET.has_evidence|urlencode }}&verified={{ request.GET.verified|urlencode }}&page={{ page.next_page_number }}">下一页</a>{% endif %}</nav>{% endif %}
