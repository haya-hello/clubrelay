{% extends "ops/base.html" %}{% load static %}{% block content %}<header class="page-title"><div><h1>把资料放进来</h1><p>原件保留在本机；解析成功与 AI 分析完成是不同状态。</p></div></header><section class="panel"><form method="post" enctype="multipart/form-data" id="batch-upload">{% csrf_token %}{{ form.as_p }}<div class="field"><label for="files">选择多个文件</label><input id="files" name="files" type="file" multiple></div><div class="field"><label for="folder">或选择一个资料文件夹</label><input id="folder" name="files" type="file" multiple webkitdirectory directory></div><div id="drop-zone" class="notice" tabindex="0">也可以把文件拖到这里。不会扫描其他文件夹。</div><p id="file-selection" aria-live="polite"></p><input type="hidden" name="relative_paths" value="[]"><div class="notice">每批最多50个文件、总计200MB，单文件25MB。ZIP只安全展开一层，嵌套包不递归。图片/音视频先归档，不声称已理解内容。</div><button class="button" id="upload-button">保存并解析这批资料</button></form></section><script src="{% static 'operations/upload.js' %}" defer></script>{% endblock %}
